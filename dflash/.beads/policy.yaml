# DFlash Beads 质量门禁配置
# 确保任务完成时真正满足验收标准

allow_bypass: true

# 任务关闭策略
closure:
  # 要求填写 close_reason
  require_reason: true
  
  # 禁止空白关闭理由
  block_empty_reason: true
  
  # 关键任务需要验证
  require_verification:
    # Epic 关闭需要所有子任务完成
    epic: "all_children_closed"
    
    # Story 关闭需要所有子任务完成
    story: "all_children_closed"
    
    # Task 关闭需要满足验收标准
    task: "acceptance_criteria_met"

# 验收标准验证规则
acceptance_criteria:
  # 接受率相关任务必须有实测数据
  dflash-acceptance-rate:
    - pattern: "接受率|acceptance.*rate|accept.*rate"
      requires:
        - "实测数据|测试结果|benchmark.*result"
        - "接受率.*>=.*60%|accept.*rate.*>=.*60|AL.*>=.*8"
      forbidden:
        - "TODO|FIXME|placeholder|待实现|未完成"
  
  # 训练相关任务必须有模型文件
  dflash-model-training:
    - pattern: "训练|train|draft.*model"
      requires:
        - "模型保存|model.*saved|safetensors"
        - "loss.*<|收敛|converge"
      forbidden:
        - "TODO|FIXME|placeholder"
  
  # 测试相关任务必须有测试报告
  dflash-testing:
    - pattern: "测试|test|benchmark|验证|verify"
      requires:
        - "测试报告|test.*report|benchmark.*result"
        - "无崩溃|no.*crash|passed|通过"
      forbidden:
        - "TODO|FIXME|待测试|未测试"
  
  # 文档相关任务必须有文档链接
  dflash-documentation:
    - pattern: "文档|report|方案|plan"
      requires:
        - "docs/|\.md|文档.*保存"
      forbidden:
        - "TODO|FIXME|待补充"

# Epic 特殊规则
epic_rules:
  # DFlash 接受率提升 Epic
  dflash-qwen36-acceptance:
    id_pattern: "dflash-qwen36-acceptance"
    # Epic 关闭条件：所有验收标准必须满足
    close_conditions:
      - field: "description"
        contains: "接受率.*>=.*60%"
        or_contains: "accept.*rate.*>=.*60"
      - field: "description"
        contains: "AL.*>=.*8"
      - field: "description"
        contains: "tok/s.*>=.*60"
    # Epic 关闭时必须有实测数据
    requires_evidence:
      - "benchmark.*result|测试报告|v100_performance"
      - "接受率.*60|AL.*8"

# 质量门禁检查
quality_gates:
  # 防止虚假关闭
  prevent_fake_closure:
    # 检查关闭理由是否只是重复任务标题
    block_reason_repeat_title: true
    
    # 检查关闭理由是否包含具体信息
    require_reason_detail: true
  
  # Epic/Story 关闭前检查
  before_epic_closure:
    - "所有子任务必须实际完成"
    - "必须有测试数据或产出物"
    - "不能只有 TODO 或计划"
  
  before_story_closure:
    - "所有子任务必须实际完成"
    - "必须有可验证的产出"

# 标签验证
label_validation:
  # P0/P1 任务关闭时必须有关键证据
  p0_p1_requires:
    - "实测数据|测试报告|benchmark|完成验证"
    - 禁止: "计划中|进行中|TODO"

# 防止过早关闭
premature_closure_protection:
  # 训练任务：必须有模型产出
  training_requires_output:
    pattern: "训练|train"
    must_have: "models/|\.safetensors|\.gguf|checkpoint"
  
  # 测试任务：必须有测试结果
  testing_requires_results:
    pattern: "测试|test|benchmark"
    must_have: "tok/s|acceptance|AL|测试报告"
  
  # 数据收集任务：必须有数据文件
  data_requires_files:
    pattern: "数据|data|收集|collect"
    must_have: "models/training|data/|\.jsonl|\.parquet"

# 时间估算验证
estimate_validation:
  # 禁止 0 估算（除了特定类型）
  block_zero_estimate: true
  
  # 大任务（>8小时）需要分解
  require_breakdown_large_tasks:
    threshold_minutes: 480
    require_subtasks: true
